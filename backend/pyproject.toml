[project]
name = "hone"
version = "0.1.0"
description = "Honest evals for AI agents: real conversations, binary rubrics, pass^k, calibrated judges."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
]

[project.scripts]
hone = "hone.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["hone"]
